<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/PREIVEW_ICON.png" />
  <meta property="og:title" content="주현 ❤️재민 결혼합니다">
  <meta property="og:description" content="2026년 5월 23일 토요일 오후 5시 30분, 같이 즐겨주세요!">
  <meta property="og:url" content="https://jaeminlim92.github.io/invitation/">
  <meta property="og:image" content="https://jaeminlim92.github.io/invitation/preview_test.jpg">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>우리의 결혼식에 초대합니다</title>
  <script type="text/javascript"
          src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=%REACT_APP_NAVER_MAP_API_KEY%"></script>
  <script>
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault()
    })

    // Dynamic vh calculation
    function setVh() {
      const vh = window.innerHeight * 0.01
      document.documentElement.style.setProperty('--vh', `${vh}px`)
    }

    setVh()

    // 복사 방지 스크립트
    document.addEventListener('DOMContentLoaded', function() {
      // 우클릭 방지
      document.addEventListener('contextmenu', function(e) {
        // 갤러리 이미지는 예외 처리
        if (e.target.classList.contains('gallery-item') ||
          e.target.closest('.pswp') ||
          e.target.classList.contains('pswp__img')) {
          return true
        }
        e.preventDefault()
        return false
      })

      // 드래그 방지
      document.addEventListener('dragstart', function(e) {
        // 갤러리 이미지는 예외 처리
        if (e.target.classList.contains('gallery-item') ||
          e.target.closest('.pswp') ||
          e.target.classList.contains('pswp__img')) {
          return true
        }

        if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') {
          e.preventDefault()
          return false
        }
      })

      // 이미지 저장 방지
      document.addEventListener('keydown', function(e) {
        // S 키 (저장)
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault()
          return false
        }

        // PrintScreen 방지
        if (e.key === 'PrintScreen') {
          e.preventDefault()
          return false
        }
      })

      // 모든 이미지에 이벤트 리스너 추가
      function disableImageInteraction() {
        var images = document.getElementsByTagName('img')
        for (var i = 0; i < images.length; i++) {
          // 갤러리 이미지는 예외 처리
          if (!images[i].classList.contains('gallery-item') &&
            !images[i].closest('.pswp')) {
            images[i].oncontextmenu = function() {
              return false
            }
            images[i].ondragstart = function() {
              return false
            }
            images[i].onselectstart = function() {
              return false
            }
          }
        }

        var videos = document.getElementsByTagName('video')
        for (var i = 0; i < videos.length; i++) {
          videos[i].oncontextmenu = function() {
            return false
          }
          videos[i].ondragstart = function() {
            return false
          }
          videos[i].onselectstart = function() {
            return false
          }
        }
      }

      // 초기 실행 및 DOM 변경 시 재실행
      disableImageInteraction()

      // DOM 변경 감시
      var observer = new MutationObserver(disableImageInteraction)
      observer.observe(document.body, {childList: true, subtree: true})
    })
  </script>
  <style>
    /* 전역 스타일로 복사 방지 */
    body {
      -webkit-touch-callout: none;
    }

    img, video {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    /* 갤러리 이미지와 오디오 컨트롤은 클릭 이벤트 허용 */
    .gallery-item, .pswp__img, .audio-control {
      pointer-events: auto !important;
    }

    /* 입력 필드는 선택 가능하게 유지 */
    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text !important;
      -khtml-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
      pointer-events: auto !important;
    }
  </style>
</head>
<body>
<div id="root"></div>
</body>
</html>
