<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모바일 청첩장</title>
  <style>
    /* 기본 스타일 */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8f8f8;
      font-family: Arial, sans-serif;
    }

    /* 전체 레이아웃 */
    .layout-container {
      width: 100%;
      max-width: 600px;
      background-color: white;
      padding: 20px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      text-align: center;
    }

    /* 청첩장 정보 */
    .invitation {
      margin-bottom: 20px;
    }
    .invitation h1 {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .invitation p {
      font-size: 16px;
      color: #333;
      margin: 5px 0;
    }

    /* 갤러리 */
    .gallery-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .gallery-container img {
      width: 100px;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
      cursor: pointer;
    }

    /* 계좌 정보 */
    .bank-container {
      padding: 15px;
      background-color: #f1f1f1;
      border-radius: 10px;
      margin-top: 20px;
    }
    .bank-button {
      background-color: #d1e7ff;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div class="layout-container">
  <!-- 청첩장 정보 -->
  <div class="invitation">
    <h1>우리 결혼합니다</h1>
    <p>2026년 5월 23일 토요일 오후 5시 30분</p>
    <p>서울시 강남구 웨딩홀</p>
  </div>

  <!-- 갤러리 -->
  <div class="gallery-container">
    <img src="wedding-photo/photo-1.jpeg" alt="Wedding Photo 1">
    <img src="wedding-photo/photo-2.jpeg" alt="Wedding Photo 2">
    <img src="wedding-photo/photo-3.jpeg" alt="Wedding Photo 3">
  </div>

  <!-- 계좌 정보 -->
  <div class="bank-container">
    <p>신랑측 계좌번호 확인하기</p>
    <button class="bank-button">계좌 확인</button>
  </div>
</div>
</body>
</html>
